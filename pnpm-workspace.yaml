allowBuilds:
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - postcss@8.5.10 || 8.5.23
  - sharp@0.35.0
  - brace-expansion@5.0.8 || 5.0.9
  - js-yaml@4.3.1
  - nanoid@3.3.17
overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  postcss@<8.5.10: ^8.5.10
  sharp@<0.35.0: ^0.35.0
